[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-datacircle"
version = "0.1.0"
description = "A Pydantic AI toolset for the Datacircle API: find the best GTM APIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pydantic-ai-slim>=1.0.0", "httpx>=0.27"]
keywords = ["pydantic-ai", "pydantic", "toolset", "agents", "tools", "gtm", "api", "api-pricing", "b2b-data", "datacircle"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: Pydantic",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://datacircle.dev"
Documentation = "https://api.datacircle.dev/v1/openapi.json"
Repository = "https://github.com/waynehamadi/pydantic-ai-datacircle"

[dependency-groups]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_datacircle"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]
